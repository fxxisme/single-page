<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fxx365 • VOID</title>
  <style>
    :root {
      --black: #050505;
      --void: #0a0f0e;
      --acid: #d6ff4b;
      --cyan: #4eead5;
      --line: #2a322f;
      --text: #e0e6e3;
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      margin:0;
      background: var(--black);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 48px;
    }

    .title {
      font-size: clamp(4.5rem, 12vw, 11rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.78;
      text-align: center;
      background: linear-gradient(90deg, var(--acid), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      text-shadow: 0 0 60px rgba(214, 255, 75, 0.6);
    }

    .title:hover {
      transform: scale(1.04) rotate(1deg);
      text-shadow: 0 0 120px rgba(214, 255, 75, 0.9);
    }

    footer {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      color: #647a74;
      letter-spacing: 1px;
      opacity: 0.6;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .title { font-size: clamp(3rem, 18vw, 7rem); }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="container">
    <h1 id="title" class="title">fxx365</h1>

    <footer>2026-09-03 • THE WORK CONTINUES</footer>

    <script>
      class Particle {
        constructor() {
          this.x = Math.random() * window.innerWidth;
          this.y = Math.random() * window.innerHeight;
          this.size = Math.random() * 4.5 + 2.5;
          this.speedX = (Math.random() - 0.5) * 1.15;
          this.speedY = (Math.random() - 0.5) * 1.15;
          this.color = Math.random() > 0.5 ? '#d6ff4b' : '#4eead5';
          this.opacity = 0.75 + Math.random() * 0.25;
          this.hueShift = 0;
          this.phase = Math.random() * Math.PI * 2;
          this.vx = this.speedX;
          this.vy = this.speedY;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > window.innerWidth) this.speedX *= -1;
          if (this.y < 0 || this.y > window.innerHeight) this.speedY *= -1;
          this.hueShift += 0.012;
          this.phase += 0.08;
          this.speedX += (Math.random() - 0.5) * 0.2;
          this.speedY += (Math.random() - 0.5) * 0.2;
        }
        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = this.opacity;
          const pulse = Math.sin(Date.now() / 160 + this.phase) * 1.2 + 14;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = pulse;
          ctx.fillStyle = `hsl(${Math.sin(this.hueShift) * 55 + 30}, 100%, 88%)`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      let particles = [];
      let mouse = { x: 0, y: 0, radius: 220 };
      let canvas, ctx;
      let newParticles = [];

      function init() {
        canvas = document.getElementById('particles');
        ctx = canvas.getContext('2d', { alpha: true });
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        particles = [];
        for (let i = 0; i < 280; i++) {
          particles.push(new Particle());
        }

        window.addEventListener('resize', () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        });

        canvas.addEventListener('mousemove', (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          mouse.x = touch.clientX;
          mouse.y = touch.clientY;
        });

        canvas.addEventListener('click', (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
          createExplosion(mouse.x, mouse.y, 22);
        });

        canvas.addEventListener('touchend', (e) => {
          if (e.changedTouches.length > 0) {
            const touch = e.changedTouches[0];
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
            createExplosion(mouse.x, mouse.y, 22);
          }
        });
      }

      function createExplosion(x, y, count) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const vel = 1.6 + Math.random() * 2.8;
          const newP = {
            x: x,
            y: y,
            size: Math.random() * 3 + 2,
            speedX: Math.cos(angle) * vel,
            speedY: Math.sin(angle) * vel,
            color: Math.random() > 0.5 ? '#d6ff4b' : '#4eead5',
            opacity: 1,
            life: 50 + Math.random() * 40
          };
          newParticles.push(newP);
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.update();
          p.draw(ctx);

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x;
            const dy = p.y - p2.y;
            const distance = Math.hypot(dx, dy);
            if (distance < 118) {
              ctx.strokeStyle = `rgba(214, 255, 75, ${0.24 * (1 - distance / 118)})`;
              ctx.lineWidth = 0.9;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }

        for (let i = newParticles.length - 1; i >= 0; i--) {
          const p = newParticles[i];
          p.x += p.speedX;
          p.y += p.speedY;
          p.speedX *= 0.96;
          p.speedY *= 0.96;
          p.opacity -= 1 / p.life;
          p.size *= 0.97;
          if (p.opacity <= 0) {
            newParticles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = p.opacity;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 18;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        particles.forEach(p => {
          const dx = mouse.x - p.x;
          const dy = mouse.y - p.y;
          const distance = Math.hypot(dx, dy);
          if (distance < mouse.radius && mouse.x !== 0) {
            p.speedX += dx * 0.0019;
            p.speedY += dy * 0.0019;
          }
          p.speedX += (Math.random() - 0.5) * 0.13;
          p.speedY += (Math.random() - 0.5) * 0.13;

          p.speedX *= 0.97;
          p.speedY *= 0.97;
        });

        requestAnimationFrame(animate);
      }

      const title = document.getElementById('title');
      let pulse = 0;
      function pulseTitle() {
        pulse = Math.sin(Date.now() / 110) * 5.2 + 160;
        title.style.filter = `brightness(${1 + pulse / 850})`;
        title.style.transform = `scale(1.03) rotate(${Math.sin(Date.now() / 160) * 1.5}deg)`;
        title.style.textShadow = `0 0 ${pulse}px rgba(214, 255, 75, 0.95)`;
        requestAnimationFrame(pulseTitle);
      }

      window.onload = () => {
        init();
        animate();
        pulseTitle();
      };
    </script>
  </div>
</body>
</html>
